<article class="rounded-md border border-gray-200 bg-white p-3 relative">
  <button
    type="button"
    class="font-medium text-left after:absolute after:inset-0"
    (click)="onTaskClick()"
  >
    {{ task().title }}
  </button>
  <div class="mt-2 flex items-center gap-2 text-sm">
    <span class="rounded-full px-2 py-0.5 text-xs">{{ task().priority }}</span>

    @if (task().assigneeInitials) {
      <span><span class="sr-only">Assigned to</span>{{ task().assigneeInitials }}</span>
    }

    @if (task().dueLabel) {
      <span class="ml-auto">{{ task().dueLabel }}</span>
    }
  </div>
</article>
