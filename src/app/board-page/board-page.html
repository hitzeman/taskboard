<h2 class="p-4 text-xl font-semibold">Board</h2>

<div class="flex flex-col md:flex-row items-start gap-4 overflow-x-auto px-4 pb-4">
  @for (col of columns(); track col.status) {
    <section
      class="flex flex-col w-72 shrink-0 rounded-lg bg-gray-100 p-3 gap-2"
      [attr.aria-labelledby]="'col-' + col.status"
    >
      <h3 [id]="'col-' + col.status" class="font-medium">
        {{ col.label }}
        <span class="text-blue-600">{{ col.tasks.length }}</span>
      </h3>

      <ul class="flex flex-col gap-2">
        @for (task of col.tasks; track task.id) {
          <li>
            <app-task-card [task]="task" (opened)="onOpened($event)"></app-task-card>
          </li>
        } @empty {
          <li class="text-sm text-gray-600">No tasks</li>
        }
      </ul>
    </section>
  }
</div>
